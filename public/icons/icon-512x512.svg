<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#059669" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#grad)" />
  <!-- Medical Cross Icon -->
  <g filter="url(#shadow)" fill="#ffffff">
    <rect x="216" y="116" width="80" height="280" rx="24" />
    <rect x="116" y="216" width="280" height="80" rx="24" />
  </g>
  <!-- Inner Heart / Sparkle Accent -->
  <circle cx="256" cy="256" r="16" fill="#10b981" />
</svg>
